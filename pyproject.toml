[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-github-sync"
version = "0.1.0"
description = "Sync accepted LeetCode submissions to a GitHub repository."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ashmita Haldar" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leetcode-sync = "leetcode_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
