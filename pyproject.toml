[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-github-sync"
version = "0.1.0"
description = "Sync accepted LeetCode submissions to a GitHub repository."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ashmita Haldar" }]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[project.scripts]
leetcode-sync = "leetcode_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/leetcode_sync"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
